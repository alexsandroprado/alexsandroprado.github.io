# Metadados padrão para todos os posts do blog

freeze: true

author:
  - name: "Alexsandro Prado"
    affiliation: "Universidade Federal Rural do Semi-Árido (UFERSA)"
    orcid: "0000-0002-7072-3621"

reading-time: true

# Gera o bloco "Citação" (texto e BibTeX) ao final de cada post
citation:
  type: post-weblog
  container-title: "Blog de Alexsandro Prado"
appendix-cite-as: display

# Legendas no padrão ABNT: "Figura 1 - Título"
crossref:
  title-delim: "\u00A0-"
# Referência da citação no padrão ABNT (e datas em português)
csl: ../../../assets/csl/abnt.csl

format:
  html:
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    code-copy: true
    code-overflow: wrap
    # Funções do R nos blocos de código viram links para a documentação
    code-link: true

# Gráficos carregados sob demanda (só quando chegam à tela)
knitr:
  opts_chunk:
    out.extra: 'loading="lazy"'

execute:
  echo: false
  warning: false
  error: false

# Comentários via giscus (GitHub Discussions)
# Requisitos: Discussions ativadas no repositório e o app giscus instalado
# (https://github.com/apps/giscus). O Quarto obtém os IDs automaticamente.
comments:
  giscus:
    repo: alexsandroprado/alexsandroprado.github.io
    repo-id: "R_kgDOLvpplg"
    category: "Announcements"
    mapping: "pathname"
    reactions-enabled: true
    input-position: top
    loading: lazy
    language: pt
    theme:
      light: light
      dark: transparent_dark
body-classes: post
