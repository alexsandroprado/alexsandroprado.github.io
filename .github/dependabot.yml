# Mantém atualizadas as ações do GitHub usadas nas rotinas automáticas.
# As ações estão fixadas pelo identificador do commit; o Dependabot
# abre um pedido de atualização quando sai uma versão nova.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ações do GitHub"
