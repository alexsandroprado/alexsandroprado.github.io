# Atualiza mensalmente o indicador de emprego formal (Novo CAGED)
# exibido na página Produção técnica. Também pode ser executado manualmente
# na aba Actions do GitHub ("Run workflow").

name: Indicador CAGED

on:
  schedule:
    # Dia 5 e dia 25 de cada mês, 9h UTC (6h em Mossoró)
    - cron: "0 9 5,25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript -e 'install.packages(c("datacaged", "dplyr", "DBI"))'

      - name: Atualizar dados
        run: Rscript scripts/atualiza_indicador_caged.R

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add producao-tecnica/dados/*.csv docs/producao-tecnica/dados/*.csv
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualiza indicador do CAGED"
            git push
          fi
