project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!README.md"
  resources:
    - "assets/katex/**"

lang: pt-BR

website:
  title: "Alexsandro Prado"
  site-url: "https://alexsandroprado.github.io/"
  description: "Professor Adjunto da UFERSA. Economia do trabalho, contabilidade financeira, ESG e governança corporativa."
  favicon: "images/favicon.ico"
  image: "images/alexsandro.png"
  open-graph: true
  # Aviso de cookies (LGPD): o Google Tag Manager só carrega após o consentimento
  cookie-consent:
    type: express
    style: simple
    palette: light
    language: pt
    policy-url: /privacidade.html
    prefs-text: "Preferências de cookies"
  twitter-card: true
  back-to-top-navigation: true
  # Rascunhos: posts com "draft: true" são renderizados, mas não aparecem
  # em listagens, busca nem menus (acessíveis só pelo endereço direto)
  draft-mode: unlinked
  reader-mode: false
  search:
    location: navbar
    type: overlay
  navbar:
    logo: images/logo-ap-icone.svg
    logo-alt: "Logo AP"
    left:
      - href: pesquisa/index.qmd
        text: Pesquisa
      - href: publicacoes/index.qmd
        text: Publicações
      - href: software/index.qmd
        text: Software e dados
      - href: ensino/index.qmd
        text: Ensino
      - href: novidades/index.qmd
        text: Novidades
      - href: blog/index.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/alexsandroprado
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/alexsandroprado/
        aria-label: LinkedIn
      - icon: rss
        href: blog/index.xml
        aria-label: RSS do blog

  page-footer:
    left: "© 2026 Alexsandro Prado · Universidade Federal Rural do Semi-Árido (UFERSA) · [Privacidade](/privacidade.html)"
    right: "Conteúdo sob licença [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.pt-br) · Feito com [Quarto](https://quarto.org)"

date-format: "DD/MM/YYYY"

# Faixa escura com o título no topo de cada página (cores em styles.scss)
title-block-banner: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    # KaTeX 0.19.1 hospedado no próprio site (assets/katex), sem CDN externo
    html-math-method:
      method: katex
      url: "/assets/katex/"
    include-in-header:
      file: header.html
    code-copy: true
    code-overflow: wrap
    # Esconde o e-mail de robôs de spam (o link continua funcionando)
    email-obfuscation: javascript
    # Notas de rodapé exibidas ao passar o mouse
    footnotes-hover: true
    # Links externos abrem em nova aba
    link-external-newwindow: true
    link-external-icon: false
    link-external-filter: '^(?:http:|https:)\/\/alexsandroprado\.github\.io'
    smooth-scroll: true

# Comentários (opcional): habilite GitHub Discussions no repositório,
