project:
  type: website
  output-dir: docs
  # Limpa os arquivos .llms.md (código OJS, rótulos de botões, duplicações)
  post-render: scripts/limpa_llms.py
  render:
    - "*.qmd"
    - "!README.md"
    - "!blog/posts/*/*.ipynb"
  resources:
    - "assets/katex/**"
    - "assets/js/**"
    - "images/og/*.png"
    - "images/avatar.webp"
    - "images/pwa/*.png"
    - "manifest.webmanifest"
    - "sw.js"
    - "offline.html"
    - "assets/logos/*.svg"
    - "assets/fonts/web/*"
    - "CNAME"
    - "producao-tecnica/dados/*.csv"

lang: pt-BR

website:
  title: "Alexsandro Prado"
  site-url: "https://alexsandroprado.site/"
  # Versão em texto para modelos de linguagem (llms.txt e .llms.md por página)
  llms-txt: true
  description: "Professor Adjunto da UFERSA. Economia do trabalho, contabilidade financeira, ESG e governança corporativa."
  favicon: "images/favicon.ico"
  image: "https://alexsandroprado.site/images/og/padrao.png"
  open-graph: true
  # Aviso de cookies (LGPD): o Google Tag Manager só carrega após o consentimento
  cookie-consent:
    type: express
    style: simple
    palette: light
    language: pt
    policy-url: /privacidade.html
    prefs-text: "Preferências de cookies"
  twitter-card: true
  back-to-top-navigation: true
  # Rascunhos: posts com "draft: true" são renderizados, mas não aparecem
  # em listagens, busca nem menus (acessíveis só pelo endereço direto)
  draft-mode: unlinked
  reader-mode: false
  search:
    location: navbar
    type: overlay
  navbar:
    logo: images/logo-ap-icone.svg
    logo-alt: "Logo AP"
    left:
      - href: blog/index.qmd
        text: Blog
      - text: Ensino
        menu:
          - href: ensino/index.qmd
            text: Disciplinas
          - href: ensino/index.qmd#orientacao
            text: Orientação
          - href: ensino/index.qmd#materiais
            text: Materiais
      - text: Pesquisa
        menu:
          - href: pesquisa/index.qmd
            text: Linhas e projetos
          - href: publicacoes/index.qmd
            text: Publicações
      - href: producao-tecnica/index.qmd
        text: Produção técnica
      - href: extensao/index.qmd
        text: Extensão
      - href: parcerias/index.qmd
        text: Parcerias
    right:
      - icon: github
        href: https://github.com/alexsandroprado
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/alexsandroprado/
        aria-label: LinkedIn
      - icon: rss
        href: blog/index.xml
        aria-label: RSS do blog

  page-footer:
    left: "<span class=\"marca-rodape\">Alexsandro Prado</span><br>Professor Adjunto · Ciências Contábeis da UFERSA"
    center: "[Blog](/blog/index.qmd) · [Ensino](/ensino/index.qmd) · [Pesquisa](/pesquisa/index.qmd) · [Produção técnica](/producao-tecnica/index.qmd) · [Extensão](/extensao/index.qmd) · [Parcerias](/parcerias/index.qmd) · [Privacidade](/privacidade.qmd)<br><span class=\"rodape-nota\"><span class=\"nw\">Licença <a href=\"https://creativecommons.org/licenses/by/4.0/deed.pt-br\" class=\"licenca-cc\" title=\"Creative Commons Atribuição 4.0 (CC BY 4.0)\" aria-label=\"Licença Creative Commons Atribuição 4.0 (CC BY 4.0)\"><img src=\"/assets/logos/cc-cc.svg\" alt=\"\" class=\"cc-icone\" width=\"14\" height=\"14\" style=\"height:1.1em;width:1.1em;vertical-align:-0.22em\"><img src=\"/assets/logos/cc-by.svg\" alt=\"\" class=\"cc-icone\" width=\"14\" height=\"14\" style=\"height:1.1em;width:1.1em;vertical-align:-0.22em\"></a></span> · <span class=\"feito-com\">Feito com <a href=\"https://www.r-project.org/\" title=\"R\"><img src=\"/assets/logos/r.svg\" alt=\"R\" class=\"logo-r\" width=\"20\" height=\"16\" style=\"height:1.2em;width:auto;vertical-align:-0.3em\"></a> e <a href=\"https://quarto.org/\" title=\"Quarto\"><img src=\"/assets/logos/quarto.svg\" alt=\"Quarto\" class=\"logo-quarto\" width=\"56\" height=\"12\" style=\"height:.92em;width:auto;vertical-align:-0.22em\"></a></span></span>"
    right:
      - icon: github
        href: https://github.com/alexsandroprado
        aria-label: GitHub de Alexsandro Prado
      - icon: linkedin
        href: https://www.linkedin.com/in/alexsandroprado/
        aria-label: LinkedIn de Alexsandro Prado
      - icon: youtube
        href: https://www.youtube.com/@profalexsandroprado
        aria-label: Canal de Alexsandro Prado no YouTube
      - icon: envelope
        href: /index.qmd#contato
        aria-label: Contato

date-format: "DD/MM/YYYY"

# Faixa escura com o título no topo de cada página (cores em styles.scss)
title-block-banner: true

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    # Segue a preferência de cor do sistema (claro ou escuro) na primeira visita
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    # KaTeX 0.19.1 hospedado no próprio site (assets/katex), sem CDN externo
    html-math-method:
      method: katex
      url: "/assets/katex/"
    include-in-header:
      file: header.html
    code-copy: true
    code-overflow: wrap
    # Esconde o e-mail de robôs de spam (o link continua funcionando)
    email-obfuscation: javascript
    # Notas de rodapé exibidas ao passar o mouse
    footnotes-hover: true
    # Links externos abrem em nova aba
    link-external-newwindow: true
    link-external-icon: false
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?alexsandroprado\.(?:site|github\.io)'
    smooth-scroll: true

